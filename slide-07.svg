<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'DM Serif Display', Georgia, 'Source Sans 3', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <!-- ============ DEFS ============ -->
  <defs>
    <filter id="card-shadow-md" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1b2838" flood-opacity="0.08"/>
    </filter>
    <filter id="card-shadow-lg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1b2838" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="hero-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
    <linearGradient id="red-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="blue-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2874a6"/>
    </linearGradient>
    <linearGradient id="green-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#229954"/>
    </linearGradient>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="1280" height="720" fill="#f8f9fa"/>

  <!-- Decorative accent stripe -->
  <g data-decorative="true">
    <rect x="0" y="0" width="6" height="720" fill="#e74c3c"/>
    <circle cx="1196" cy="88" r="3" fill="#4a6fa5" opacity="0.35"/>
    <circle cx="1208" cy="88" r="3" fill="#4a6fa5" opacity="0.35"/>
    <circle cx="1220" cy="88" r="3" fill="#4a6fa5" opacity="0.35"/>
  </g>

  <!-- ============ HEADER ============ -->
  <g>
    <text x="60" y="82" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" font-weight="700" fill="#e74c3c" letter-spacing="4">PART 02  /  NEW TAIPEI  /  07</text>
    <text x="60" y="128" font-family="'DM Serif Display', Georgia, 'PingFang SC', serif" font-size="40" font-weight="700" fill="#1b2838">新北市 9 大行政區房價總覽</text>
    <text x="60" y="158" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="400" fill="#4a6fa5">蛋黃、性價比、蛋白三帶清晰分層 · 500-1500 萬預算決策地圖</text>
    <line x1="60" y1="180" x2="1220" y2="180" stroke="#e9ecef" stroke-width="1"/>
  </g>

  <!-- ============ TOP METRIC ROW (3 cards) ============ -->
  <!-- Metric Card 1: 新北市均價 (navy hero) -->
  <g transform="translate(60, 196)">
    <rect width="380" height="106" rx="6" fill="url(#hero-navy)" filter="url(#card-shadow-lg)"/>
    <text x="22" y="30" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" opacity="0.6" letter-spacing="2">NEW TAIPEI AVG</text>
    <text x="22" y="70" font-family="'DM Serif Display', Georgia, serif" font-size="40" font-weight="700" fill="#ffffff">58<tspan font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#ffffff" opacity="0.65"> 萬/坪</tspan></text>
    <text x="260" y="70" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="700" fill="#2ecc71">▲ +4.88%</text>
    <text x="22" y="94" font-family="'Source Sans 3', Arial, 'PingFang TC', sans-serif" font-size="12" fill="#ffffff" opacity="0.6">新北市均價年增率</text>
  </g>

  <!-- Metric Card 2: 主力成交帶 -->
  <g transform="translate(460, 196)">
    <rect width="380" height="106" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1" filter="url(#card-shadow-md)"/>
    <rect x="0" y="0" width="4" height="106" rx="2" fill="#e74c3c"/>
    <text x="22" y="30" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" font-weight="600" fill="#4a6fa5" letter-spacing="2">MAIN BAND</text>
    <text x="22" y="70" font-family="'DM Serif Display', Georgia, serif" font-size="36" font-weight="700" fill="#1b2838">1000-1500<tspan font-family="'Source Sans 3', Arial, 'PingFang TC', sans-serif" font-size="14" font-weight="400" fill="#4a6fa5"> 萬</tspan></text>
    <text x="22" y="94" font-family="'Source Sans 3', Arial, 'PingFang TC', sans-serif" font-size="12" fill="#4a6fa5">主力成交帶占比 30-39%</text>
  </g>

  <!-- Metric Card 3: 涵蓋行政區 -->
  <g transform="translate(860, 196)">
    <rect width="360" height="106" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1" filter="url(#card-shadow-md)"/>
    <rect x="0" y="0" width="4" height="106" rx="2" fill="#4a6fa5"/>
    <text x="22" y="30" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" font-weight="600" fill="#4a6fa5" letter-spacing="2">COVERAGE</text>
    <text x="22" y="70" font-family="'DM Serif Display', Georgia, serif" font-size="36" font-weight="700" fill="#1b2838">9<tspan font-family="'Source Sans 3', Arial, 'PingFang TC', sans-serif" font-size="14" font-weight="400" fill="#4a6fa5"> 行政區  /  3 帶</tspan></text>
    <text x="22" y="94" font-family="'Source Sans 3', Arial, 'PingFang TC', sans-serif" font-size="12" fill="#4a6fa5">蛋黃 · 性價比 · 蛋白</text>
  </g>

  <!-- ============ MAIN CHART CARD (Hero) ============ -->
  <g transform="translate(60, 316)">
    <rect width="780" height="332" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1" filter="url(#card-shadow-md)"/>

    <!-- Card header -->
    <text x="24" y="38" font-family="'DM Serif Display', Georgia, 'PingFang SC', serif" font-size="20" font-weight="700" fill="#1b2838">新北市 7 區均價對照</text>
    <text x="24" y="58" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="12" fill="#4a6fa5">單位：萬/坪 · 資料：2026 Q1 實價登錄</text>

    <!-- Y-axis scale hints -->
    <line x1="60" y1="94" x2="740" y2="94" stroke="#e9ecef" stroke-width="0.5" stroke-dasharray="2,3"/>
    <line x1="60" y1="154" x2="740" y2="154" stroke="#e9ecef" stroke-width="0.5" stroke-dasharray="2,3"/>
    <line x1="60" y1="214" x2="740" y2="214" stroke="#e9ecef" stroke-width="0.5" stroke-dasharray="2,3"/>
    <text x="52" y="98" text-anchor="end" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" fill="#4a6fa5">100</text>
    <text x="52" y="158" text-anchor="end" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" fill="#4a6fa5">70</text>
    <text x="52" y="218" text-anchor="end" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" fill="#4a6fa5">40</text>

    <!-- Baseline -->
    <line x1="60" y1="264" x2="740" y2="264" stroke="#1b2838" stroke-width="1.5" opacity="0.8"/>

    <!-- Bars (scale: value*1.85=height; baseline y=264) -->
    <!-- 永和 91 -->
    <g transform="translate(130, 0)">
      <rect x="-28" y="96" width="56" height="168" rx="2" fill="url(#red-bar)"/>
      <text x="0" y="88" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="16" font-weight="700" fill="#1b2838">91</text>
      <text x="0" y="284" text-anchor="middle" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1b2838">永和</text>
      <text x="0" y="300" text-anchor="middle" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="12" fill="#e74c3c" font-weight="700">蛋黃</text>
    </g>
    <!-- 板橋 87.7 -->
    <g transform="translate(220, 0)">
      <rect x="-28" y="102" width="56" height="162" rx="2" fill="url(#red-bar)"/>
      <text x="0" y="94" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="16" font-weight="700" fill="#1b2838">87.7</text>
      <text x="0" y="284" text-anchor="middle" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1b2838">板橋</text>
    </g>
    <!-- 三重 81.1 -->
    <g transform="translate(310, 0)">
      <rect x="-28" y="114" width="56" height="150" rx="2" fill="url(#red-bar)"/>
      <text x="0" y="106" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="16" font-weight="700" fill="#1b2838">81.1</text>
      <text x="0" y="284" text-anchor="middle" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1b2838">三重</text>
    </g>
    <!-- 中和 80 -->
    <g transform="translate(400, 0)">
      <rect x="-28" y="116" width="56" height="148" rx="2" fill="url(#red-bar)"/>
      <text x="0" y="108" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="16" font-weight="700" fill="#1b2838">80</text>
      <text x="0" y="284" text-anchor="middle" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1b2838">中和</text>
    </g>
    <!-- 新莊 62 -->
    <g transform="translate(490, 0)">
      <rect x="-28" y="150" width="56" height="114" rx="2" fill="url(#blue-bar)"/>
      <text x="0" y="142" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="16" font-weight="700" fill="#1b2838">62</text>
      <text x="0" y="284" text-anchor="middle" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1b2838">新莊</text>
      <text x="0" y="300" text-anchor="middle" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="12" fill="#3498db" font-weight="700">性價比</text>
    </g>
    <!-- 汐止 58 -->
    <g transform="translate(580, 0)">
      <rect x="-28" y="156" width="56" height="108" rx="2" fill="url(#blue-bar)"/>
      <text x="0" y="148" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="16" font-weight="700" fill="#1b2838">58</text>
      <text x="0" y="284" text-anchor="middle" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1b2838">汐止</text>
    </g>
    <!-- 淡水 38 -->
    <g transform="translate(680, 0)">
      <rect x="-28" y="192" width="56" height="72" rx="2" fill="url(#green-bar)"/>
      <text x="0" y="184" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="16" font-weight="700" fill="#1b2838">38</text>
      <text x="0" y="284" text-anchor="middle" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1b2838">淡水</text>
      <text x="0" y="300" text-anchor="middle" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="12" fill="#2ecc71" font-weight="700">蛋白</text>
    </g>
  </g>

  <!-- ============ RIGHT SIDEBAR: 三帶分層 Legend ============ -->
  <g transform="translate(860, 316)">
    <rect width="360" height="332" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1" filter="url(#card-shadow-md)"/>

    <!-- Card header -->
    <text x="24" y="38" font-family="'DM Serif Display', Georgia, 'PingFang SC', serif" font-size="20" font-weight="700" fill="#1b2838">三帶價值分層</text>
    <text x="24" y="58" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="12" fill="#4a6fa5">Yolk · Value · White Bands</text>

    <!-- Belt 1: 蛋黃帶 -->
    <g transform="translate(24, 78)">
      <rect x="0" y="0" width="6" height="52" rx="3" fill="#e74c3c"/>
      <text x="18" y="16" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#1b2838">蛋黃帶</text>
      <text x="80" y="16" font-family="'DM Serif Display', Georgia, serif" font-size="14" font-weight="700" fill="#e74c3c">80-91 萬/坪</text>
      <text x="18" y="38" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="12" fill="#4a6fa5">永和 · 板橋 · 三重 · 中和</text>
    </g>

    <!-- Belt 2: 性價比帶 -->
    <g transform="translate(24, 148)">
      <rect x="0" y="0" width="6" height="52" rx="3" fill="#3498db"/>
      <text x="18" y="16" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#1b2838">性價比帶</text>
      <text x="80" y="16" font-family="'DM Serif Display', Georgia, serif" font-size="14" font-weight="700" fill="#3498db">48-68 萬/坪</text>
      <text x="18" y="38" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="12" fill="#4a6fa5">新莊 · 汐止 · 土城</text>
    </g>

    <!-- Belt 3: 蛋白帶 -->
    <g transform="translate(24, 218)">
      <rect x="0" y="0" width="6" height="52" rx="3" fill="#2ecc71"/>
      <text x="18" y="16" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#1b2838">蛋白帶</text>
      <text x="80" y="16" font-family="'DM Serif Display', Georgia, serif" font-size="14" font-weight="700" fill="#2ecc71">29-47 萬/坪</text>
      <text x="18" y="38" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="12" fill="#4a6fa5">淡水 · 鶯歌 · 三峽</text>
    </g>

    <!-- Divider -->
    <line x1="24" y1="284" x2="336" y2="284" stroke="#e9ecef" stroke-width="1"/>

    <!-- Key insight footer -->
    <text x="24" y="302" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" font-weight="700" fill="#e74c3c" letter-spacing="2">KEY INSIGHT</text>
    <text x="24" y="320" font-family="'Source Sans 3', Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#1b2838">性價比帶是新青安主戰場</text>
  </g>

  <text x="60" y="694" font-size="12" fill="#8a9ab0" letter-spacing="1">HOMELAB · 雙北 500-1500 萬購屋指南</text>
  <text x="1220" y="694" text-anchor="end" font-size="12" fill="#8a9ab0" letter-spacing="1">07 / 13</text>
</svg>
