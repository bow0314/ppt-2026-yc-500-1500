<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Source Sans 3', Arial, 'PingFang SC', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
  <!-- =============================================================
       Slide 10  ·  雙北捷運親民站 Top 10
       Style: editorial-infographic
       Layout: horizontal_split (hero table + 3 callout cards)
       ============================================================= -->

  <defs>
    <!-- Shadow filters -->
    <filter id="shadow-md" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1b2838" flood-opacity="0.10"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#1b2838" flood-opacity="0.08"/>
    </filter>

    <!-- Hero card subtle top highlight -->
    <linearGradient id="card-highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>

    <!-- Dark navy gradient for callout cards (uses primary + slide_type_overrides.cover bg) -->
    <linearGradient id="navy-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>

    <!-- Decorative serif ornament reusable -->
    <g id="rule-ornament" data-decorative="true">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#e74c3c" stroke-width="2"/>
      <circle cx="48" cy="0" r="2.5" fill="#e74c3c"/>
      <line x1="56" y1="0" x2="96" y2="0" stroke="#e74c3c" stroke-width="2"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#f8f9fa"/>

  <!-- Decorative margin rules (editorial touch) -->
  <g data-decorative="true">
    <line x1="60" y1="36" x2="1220" y2="36" stroke="#1b2838" stroke-width="0.5" opacity="0.25"/>
  </g>

  <!-- ==================== Header / Masthead ==================== -->
  <g transform="translate(60,60)">
    <!-- Section label (small caps) -->
    <text x="0" y="14" font-size="12" font-weight="700" letter-spacing="3.5" fill="#e74c3c">
      PART 3  ·  MRT LIVING  ·  ISSUE 10
    </text>

    <!-- Slide title (serif) -->
    <text x="0" y="62" font-family="'DM Serif Display', Georgia, 'PingFang SC', 'PingFang TC', 'Noto Serif TC', serif"
          font-size="42" font-weight="700" fill="#1b2838">雙北捷運親民站 Top 10</text>

    <!-- Subtitle -->
    <text x="0" y="86" font-size="16" font-weight="400" fill="#4a6fa5">
      500-1500 萬的捷運宅選擇地圖  ·  甜蜜距離 200-500m / 步行 5-7 分
    </text>
  </g>

  <!-- Right-aligned kicker metric -->
  <g transform="translate(1220,72)">
    <text x="0" y="0" text-anchor="end" font-size="12" font-weight="700" letter-spacing="2" fill="#1b2838" opacity="0.55">涵蓋車站</text>
    <text x="0" y="42" text-anchor="end" font-family="'DM Serif Display', Georgia, serif" font-size="44" font-weight="700" fill="#e74c3c">10</text>
    <text x="0" y="64" text-anchor="end" font-size="12" font-weight="600" letter-spacing="2" fill="#1b2838" opacity="0.55">STATIONS MAPPED</text>
  </g>

  <!-- ==================== Hero Card — Top Stations Table ==================== -->
  <g transform="translate(60,178)">
    <!-- Card surface -->
    <rect width="1160" height="288" rx="6" fill="url(#card-highlight)" stroke="#e9ecef" stroke-width="1" filter="url(#shadow-md)"/>

    <!-- Card header strip -->
    <g transform="translate(28,24)">
      <text x="0" y="0" font-size="12" font-weight="700" letter-spacing="3" fill="#e74c3c">THE RANKING</text>
      <text x="0" y="24" font-family="'DM Serif Display', Georgia, 'PingFang TC', serif" font-size="22" font-weight="700" fill="#1b2838">
        六大親民捷運站 · 單價 / 總價帶 / 特色
      </text>
      <!-- Legend dots -->
      <g transform="translate(670,10)">
        <circle cx="0" cy="0" r="5" fill="#2ecc71"/>
        <text x="10" y="4" font-size="12" font-weight="600" fill="#1b2838" opacity="0.75">3 字頭 · 極致坪效</text>
        <circle cx="160" cy="0" r="5" fill="#3498db"/>
        <text x="170" y="4" font-size="12" font-weight="600" fill="#1b2838" opacity="0.75">4 字頭 · 機能進階</text>
        <circle cx="320" cy="0" r="5" fill="#e74c3c"/>
        <text x="330" y="4" font-size="12" font-weight="600" fill="#1b2838" opacity="0.75">5 字頭 · 量能王者</text>
      </g>
    </g>

    <!-- Divider below header -->
    <line x1="28" y1="78" x2="1132" y2="78" stroke="#1b2838" stroke-width="1.2" opacity="0.85"/>

    <!-- Column labels -->
    <g transform="translate(28,100)" font-size="12" font-weight="700" letter-spacing="2" fill="#1b2838" opacity="0.55">
      <text x="0" y="0">#</text>
      <text x="50" y="0">捷運站 · STATION</text>
      <text x="530" y="0" text-anchor="end">單價 (萬/坪)</text>
      <text x="620" y="0">總價帶 (萬)</text>
      <text x="800" y="0">特色亮點 · HIGHLIGHT</text>
      <text x="1104" y="0" text-anchor="end">分級</text>
    </g>
    <line x1="28" y1="112" x2="1132" y2="112" stroke="#e9ecef" stroke-width="1"/>

    <!-- Row 1 · 淡水 -->
    <g transform="translate(28,138)">
      <text x="0" y="0" font-family="'DM Serif Display', Georgia, serif" font-size="18" font-weight="700" fill="#2ecc71">01</text>
      <text x="50" y="0" font-size="18" font-weight="700" fill="#1b2838">淡水</text>
      <text x="140" y="0" font-size="12" fill="#1b2838" opacity="0.55">TAMSUI · 淡水信義線</text>
      <text x="530" y="0" text-anchor="end" font-family="'DM Serif Display', Georgia, serif" font-size="24" font-weight="700" fill="#2ecc71">34.4</text>
      <text x="620" y="0" font-size="15" fill="#1b2838">500 – 800</text>
      <text x="800" y="0" font-size="14" fill="#1b2838" opacity="0.75">全雙北單價最低  ·  家庭首購空間王</text>
      <rect x="1056" y="-14" width="48" height="20" rx="3" fill="#2ecc71"/>
      <text x="1080" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3字頭</text>
    </g>
    <line x1="28" y1="156" x2="1132" y2="156" stroke="#e9ecef" stroke-width="1"/>

    <!-- Row 2 · 泰山貴和 -->
    <g transform="translate(28,180)">
      <text x="0" y="0" font-family="'DM Serif Display', Georgia, serif" font-size="18" font-weight="700" fill="#2ecc71">02</text>
      <text x="50" y="0" font-size="18" font-weight="700" fill="#1b2838">泰山貴和</text>
      <text x="140" y="0" font-size="12" fill="#1b2838" opacity="0.55">環狀線</text>
      <text x="530" y="0" text-anchor="end" font-family="'DM Serif Display', Georgia, serif" font-size="24" font-weight="700" fill="#2ecc71">35.3</text>
      <text x="620" y="0" font-size="15" fill="#1b2838">600 – 900</text>
      <text x="800" y="0" font-size="14" fill="#1b2838" opacity="0.75">新北第二親民  ·  環狀線新線題材</text>
      <rect x="1056" y="-14" width="48" height="20" rx="3" fill="#2ecc71"/>
      <text x="1080" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3字頭</text>
    </g>
    <line x1="28" y1="198" x2="1132" y2="198" stroke="#e9ecef" stroke-width="1"/>

    <!-- Row 3 · 竹圍 -->
    <g transform="translate(28,222)">
      <text x="0" y="0" font-family="'DM Serif Display', Georgia, serif" font-size="18" font-weight="700" fill="#2ecc71">03</text>
      <text x="50" y="0" font-size="18" font-weight="700" fill="#1b2838">竹圍</text>
      <text x="140" y="0" font-size="12" fill="#1b2838" opacity="0.55">ZHUWEI · 淡水信義線</text>
      <text x="530" y="0" text-anchor="end" font-family="'DM Serif Display', Georgia, serif" font-size="24" font-weight="700" fill="#2ecc71">37</text>
      <text x="620" y="0" font-size="15" fill="#1b2838">700 – 1100</text>
      <text x="800" y="0" font-size="14" fill="#1b2838" opacity="0.75">近淡水線  ·  河景宅首選</text>
      <rect x="1056" y="-14" width="48" height="20" rx="3" fill="#2ecc71"/>
      <text x="1080" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3字頭</text>
    </g>
    <line x1="28" y1="240" x2="1132" y2="240" stroke="#e9ecef" stroke-width="1"/>

    <!-- Row 4 · 新北投 (4 字頭 · 北市最親民) -->
    <g transform="translate(28,264)">
      <text x="0" y="0" font-family="'DM Serif Display', Georgia, serif" font-size="18" font-weight="700" fill="#3498db">04</text>
      <text x="50" y="0" font-size="18" font-weight="700" fill="#1b2838">新北投</text>
      <text x="140" y="0" font-size="12" fill="#1b2838" opacity="0.55">淡水支線</text>
      <text x="530" y="0" text-anchor="end" font-family="'DM Serif Display', Georgia, serif" font-size="24" font-weight="700" fill="#3498db">40</text>
      <text x="620" y="0" font-size="15" fill="#1b2838">1000 – 1418</text>
      <text x="800" y="0" font-size="14" fill="#1b2838" opacity="0.75">台北市內最親民  ·  溫泉生活圈</text>
      <rect x="1056" y="-14" width="48" height="20" rx="3" fill="#3498db"/>
      <text x="1080" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4字頭</text>
    </g>
  </g>

  <!-- ==================== Bottom Row — Three Callout Cards ==================== -->

  <!-- Card A · 4-5 字頭機能帶 -->
  <g transform="translate(60,488)">
    <rect width="370" height="170" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1" filter="url(#shadow-sm)"/>
    <!-- Accent left bar -->
    <rect x="0" y="0" width="4" height="170" rx="2" fill="#3498db"/>
    <text x="24" y="34" font-size="12" font-weight="700" letter-spacing="2.5" fill="#3498db">A · 機能進階帶</text>
    <text x="24" y="64" font-family="'DM Serif Display', Georgia, 'PingFang TC', serif" font-size="22" font-weight="700" fill="#1b2838">4 – 5 字頭 · 六站</text>

    <!-- Station chips (neutral tokenized fills) -->
    <g transform="translate(24,82)" font-size="13" font-weight="600" fill="#1b2838">
      <rect x="0" y="0" width="52" height="22" rx="3" fill="#f8f9fa" stroke="#e9ecef"/>
      <text x="26" y="15" text-anchor="middle">迴龍</text>
      <rect x="58" y="0" width="52" height="22" rx="3" fill="#f8f9fa" stroke="#e9ecef"/>
      <text x="84" y="15" text-anchor="middle">北投</text>
      <rect x="116" y="0" width="52" height="22" rx="3" fill="#f8f9fa" stroke="#e9ecef"/>
      <text x="142" y="15" text-anchor="middle">蘆洲</text>
      <rect x="174" y="0" width="52" height="22" rx="3" fill="#f8f9fa" stroke="#e9ecef"/>
      <text x="200" y="15" text-anchor="middle">新莊</text>
      <rect x="0" y="28" width="68" height="22" rx="3" fill="#f8f9fa" stroke="#e9ecef"/>
      <text x="34" y="43" text-anchor="middle">台北橋</text>
      <rect x="74" y="28" width="52" height="22" rx="3" fill="#f8f9fa" stroke="#e9ecef"/>
      <text x="100" y="43" text-anchor="middle">三重</text>
    </g>

    <line x1="24" y1="148" x2="346" y2="148" stroke="#e9ecef"/>
    <text x="24" y="162" font-size="12" fill="#1b2838" opacity="0.6">主打 1000 – 1500 萬 · 2 房成屋</text>
  </g>

  <!-- Card B · 甜蜜距離 (key design principle) -->
  <g transform="translate(455,488)">
    <rect width="370" height="170" rx="6" fill="url(#navy-card)" filter="url(#shadow-md)"/>
    <!-- Decorative radiating dots to suggest "distance" -->
    <g data-decorative="true" opacity="0.25">
      <circle cx="320" cy="36" r="28" fill="none" stroke="#e74c3c" stroke-width="1"/>
      <circle cx="320" cy="36" r="18" fill="none" stroke="#e74c3c" stroke-width="1"/>
      <circle cx="320" cy="36" r="8" fill="#e74c3c"/>
    </g>

    <text x="24" y="34" font-size="12" font-weight="700" letter-spacing="2.5" fill="#e74c3c">B · 甜蜜距離</text>
    <text x="24" y="66" font-family="'DM Serif Display', Georgia, 'PingFang TC', serif" font-size="22" font-weight="700" fill="#ffffff">離站口的黃金半徑</text>

    <!-- Two big stats side by side -->
    <g transform="translate(24,102)">
      <text x="0" y="0" font-family="'DM Serif Display', Georgia, serif" font-size="32" font-weight="700" fill="#e74c3c">200<tspan font-size="18" fill="#ffffff" opacity="0.7">–</tspan>500<tspan font-size="14" fill="#ffffff" opacity="0.6">m</tspan></text>
      <text x="0" y="22" font-size="12" fill="#ffffff" opacity="0.55">直線距離 · DISTANCE</text>
    </g>
    <g transform="translate(200,102)">
      <text x="0" y="0" font-family="'DM Serif Display', Georgia, serif" font-size="32" font-weight="700" fill="#e74c3c">5<tspan font-size="18" fill="#ffffff" opacity="0.7">–</tspan>7<tspan font-size="14" fill="#ffffff" opacity="0.6">min</tspan></text>
      <text x="0" y="22" font-size="12" fill="#ffffff" opacity="0.55">步行時間 · WALK</text>
    </g>

    <line x1="24" y1="144" x2="346" y2="144" stroke="#ffffff" opacity="0.15"/>
    <text x="24" y="160" font-size="12" fill="#ffffff" opacity="0.65">兼顧保值性與生活品質的最適半徑</text>
  </g>

  <!-- Card C · 交易量冠軍 -->
  <g transform="translate(850,488)">
    <rect width="370" height="170" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1" filter="url(#shadow-sm)"/>
    <rect x="0" y="0" width="4" height="170" rx="2" fill="#e74c3c"/>
    <text x="24" y="34" font-size="12" font-weight="700" letter-spacing="2.5" fill="#e74c3c">C · 量能王者</text>
    <text x="24" y="64" font-family="'DM Serif Display', Georgia, 'PingFang TC', serif" font-size="22" font-weight="700" fill="#1b2838">年交易量冠軍雙雄</text>

    <!-- Ranking bars · bar width 210px, number+unit in right 100px column -->
    <g transform="translate(24,82)">
      <!-- 台北橋 · 927 (max) -->
      <text x="0" y="0" font-size="13" font-weight="700" fill="#1b2838">台北橋</text>
      <rect x="0" y="10" width="210" height="9" rx="2" fill="#e9ecef"/>
      <rect x="0" y="10" width="210" height="9" rx="2" fill="#e74c3c"/>
      <text x="222" y="4" font-family="'DM Serif Display', Georgia, serif" font-size="26" font-weight="700" fill="#e74c3c">927</text>
      <text x="222" y="24" font-size="12" fill="#1b2838" opacity="0.55">件 / 年</text>
    </g>

    <g transform="translate(24,130)">
      <!-- 景安 · 446 -->
      <text x="0" y="0" font-size="13" font-weight="700" fill="#1b2838">景安</text>
      <rect x="0" y="10" width="210" height="9" rx="2" fill="#e9ecef"/>
      <rect x="0" y="10" width="101" height="9" rx="2" fill="#f39c12"/>
      <text x="222" y="4" font-family="'DM Serif Display', Georgia, serif" font-size="26" font-weight="700" fill="#f39c12">446</text>
      <text x="222" y="24" font-size="12" fill="#1b2838" opacity="0.55">件 / 年</text>
    </g>
  </g>

  <text x="60" y="694" font-size="12" fill="#8a9ab0" letter-spacing="1">HOMELAB · 雙北 500-1500 萬購屋指南</text>
  <text x="1220" y="694" text-anchor="end" font-size="12" fill="#8a9ab0" letter-spacing="1">10 / 13</text>
</svg>
