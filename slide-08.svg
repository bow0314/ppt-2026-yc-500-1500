<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Source Sans 3','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <!-- ========== DEFS ========== -->
  <defs>
    <filter id="shadow-md" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1b2838" flood-opacity="0.10"/>
    </filter>
    <filter id="shadow-lg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#1b2838" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
  </defs>

  <!-- ========== BACKGROUND ========== -->
  <rect width="1280" height="720" fill="#f8f9fa"/>

  <!-- Decorative editorial rule -->
  <g data-decorative="true">
    <rect x="0" y="0" width="1280" height="4" fill="#1b2838"/>
    <rect x="60" y="0" width="80" height="4" fill="#e74c3c"/>
  </g>

  <!-- ========== HEADER ZONE ========== -->
  <g>
    <!-- Eyebrow / section tag -->
    <rect x="60" y="38" width="4" height="18" fill="#e74c3c"/>
    <text x="74" y="53" font-family="'Source Sans 3',sans-serif" font-size="12" font-weight="700" fill="#4a6fa5" letter-spacing="3">PART 02 — NEW TAIPEI · BUDGET PLAYBOOK</text>

    <!-- Title -->
    <text x="60" y="102" font-family="'DM Serif Display',Georgia,'PingFang TC',serif" font-size="42" font-weight="700" fill="#1b2838">新北市 500–1500 萬能買什麼</text>

    <!-- Subtitle -->
    <text x="60" y="132" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="17" fill="#4a6fa5">依預算段列出典型坪數、房型與代表區域 — 對應新青安與換屋族需求</text>

    <!-- Page number -->
    <text x="1220" y="55" font-family="'Source Sans 3',sans-serif" font-size="12" font-weight="700" fill="#1b2838" text-anchor="end" letter-spacing="2">08 / 13</text>
  </g>

  <!-- Editorial horizontal rule -->
  <line x1="60" y1="150" x2="1220" y2="150" stroke="#1b2838" stroke-width="1" opacity="0.22"/>

  <!-- ========== MAIN TABLE CARD (Hero, 2/3 width) ========== -->
  <g transform="translate(60,176)">
    <rect width="790" height="452" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1" filter="url(#shadow-md)"/>

    <!-- Card label -->
    <text x="28" y="40" font-family="'Source Sans 3',sans-serif" font-size="12" font-weight="700" fill="#4a6fa5" letter-spacing="2.5">BUDGET TIER MATRIX</text>
    <text x="28" y="66" font-family="'DM Serif Display',Georgia,'PingFang TC',serif" font-size="22" font-weight="700" fill="#1b2838">四個預算段 × 代表區域 × 典型坪型</text>

    <!-- Header row -->
    <g transform="translate(28,92)">
      <rect x="0" y="0" width="734" height="40" rx="4" fill="#1b2838"/>
      <text x="18" y="25" font-family="'Source Sans 3',sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="2">預算段</text>
      <text x="210" y="25" font-family="'Source Sans 3',sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="2">代表區域</text>
      <text x="400" y="25" font-family="'Source Sans 3',sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="2">典型坪數</text>
      <text x="560" y="25" font-family="'Source Sans 3',sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="2">典型房型</text>
    </g>

    <!-- Row 1: 500-800 -->
    <g transform="translate(28,142)">
      <rect x="0" y="0" width="734" height="72" fill="#f8f9fa" opacity="0.55"/>
      <rect x="0" y="0" width="4" height="72" fill="#3498db"/>
      <text x="18" y="32" font-family="'DM Serif Display',Georgia,'PingFang TC',serif" font-size="22" font-weight="700" fill="#1b2838">500–800<tspan font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="14" font-weight="600" dx="4">萬</tspan></text>
      <text x="18" y="56" font-family="'Source Sans 3',sans-serif" font-size="12" fill="#4a6fa5" letter-spacing="1.5">TIER 1 · ENTRY</text>
      <text x="210" y="32" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#1b2838">淡水 · 鶯歌</text>
      <text x="210" y="55" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="13" fill="#4a6fa5">新北最低總價帶</text>
      <text x="400" y="32" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#1b2838">15–25 坪</text>
      <text x="560" y="32" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="15" fill="#1b2838" opacity="0.82">1–2 房中古華廈</text>
    </g>

    <!-- Row 2: 800-1200 — HIGHLIGHTED SWEET SPOT -->
    <g transform="translate(28,214)">
      <rect x="0" y="0" width="734" height="72" fill="#fff6e8"/>
      <rect x="0" y="0" width="4" height="72" fill="#e74c3c"/>
      <text x="18" y="32" font-family="'DM Serif Display',Georgia,'PingFang TC',serif" font-size="22" font-weight="700" fill="#1b2838">800–1200<tspan font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="14" font-weight="600" dx="4">萬</tspan></text>
      <text x="18" y="56" font-family="'Source Sans 3',sans-serif" font-size="12" fill="#e74c3c" font-weight="700" letter-spacing="1.5">TIER 2 · SWEET SPOT ★</text>
      <text x="210" y="32" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#1b2838">新莊 · 汐止 · 林口</text>
      <text x="210" y="55" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="13" fill="#e74c3c" font-weight="700">新青安 1000 萬甜蜜帶</text>
      <text x="400" y="32" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#1b2838">20–28 坪</text>
      <text x="560" y="32" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="15" fill="#1b2838" opacity="0.82">2 房電梯大樓</text>
    </g>

    <!-- Row 3: 1000-1500 -->
    <g transform="translate(28,286)">
      <rect x="0" y="0" width="734" height="72" fill="#f8f9fa" opacity="0.55"/>
      <rect x="0" y="0" width="4" height="72" fill="#2ecc71"/>
      <text x="18" y="32" font-family="'DM Serif Display',Georgia,'PingFang TC',serif" font-size="22" font-weight="700" fill="#1b2838">1000–1500<tspan font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="14" font-weight="600" dx="4">萬</tspan></text>
      <text x="18" y="56" font-family="'Source Sans 3',sans-serif" font-size="12" fill="#4a6fa5" letter-spacing="1.5">TIER 3 · SPACE KING</text>
      <text x="210" y="32" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#1b2838">淡水 · 三峽</text>
      <text x="210" y="55" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="13" fill="#4a6fa5">新北最大坪效 44 坪</text>
      <text x="400" y="32" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#1b2838">35–44 坪</text>
      <text x="560" y="32" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="15" fill="#1b2838" opacity="0.82">3 房家庭換屋</text>
    </g>

    <!-- Row 4: 1200-1500 -->
    <g transform="translate(28,358)">
      <rect x="0" y="0" width="734" height="72" fill="#f8f9fa" opacity="0.55"/>
      <rect x="0" y="0" width="4" height="72" fill="#9b59b6"/>
      <text x="18" y="32" font-family="'DM Serif Display',Georgia,'PingFang TC',serif" font-size="22" font-weight="700" fill="#1b2838">1200–1500<tspan font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="14" font-weight="600" dx="4">萬</tspan></text>
      <text x="18" y="56" font-family="'Source Sans 3',sans-serif" font-size="12" fill="#4a6fa5" letter-spacing="1.5">TIER 4 · CORE BELT</text>
      <text x="210" y="32" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#1b2838">板橋 · 永和</text>
      <text x="210" y="55" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="13" fill="#4a6fa5">蛋黃帶小宅進場</text>
      <text x="400" y="32" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#1b2838">20–25 坪</text>
      <text x="560" y="32" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="15" fill="#1b2838" opacity="0.82">2 房通勤首選</text>
    </g>
  </g>

  <!-- ========== SIDEBAR CARD (Hero callout, 1/3 width) ========== -->
  <g transform="translate(876,176)">
    <rect width="344" height="452" rx="6" fill="url(#hero-bg)" filter="url(#shadow-lg)"/>

    <!-- Accent marker -->
    <rect x="0" y="0" width="344" height="4" fill="url(#accent-bar)"/>

    <!-- Label -->
    <text x="28" y="44" font-family="'Source Sans 3',sans-serif" font-size="12" font-weight="700" fill="#e74c3c" letter-spacing="2.5">EDITOR'S PICK</text>

    <!-- Headline -->
    <text x="28" y="84" font-family="'DM Serif Display',Georgia,'PingFang TC',serif" font-size="26" font-weight="700" fill="#ffffff">新青安甜蜜帶</text>
    <text x="28" y="114" font-family="'DM Serif Display',Georgia,'PingFang TC',serif" font-size="26" font-weight="700" fill="#ffffff">Sweet Spot</text>

    <!-- Divider -->
    <line x1="28" y1="134" x2="76" y2="134" stroke="#e74c3c" stroke-width="2"/>

    <!-- Big number cluster -->
    <g transform="translate(28,174)">
      <text x="0" y="0" font-family="'DM Serif Display',Georgia,sans-serif" font-size="64" font-weight="700" fill="#e74c3c">1000</text>
      <text x="182" y="-4" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="14" font-weight="700" fill="#ffffff">萬元</text>
      <text x="182" y="14" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="12" fill="#ffffff" opacity="0.7">新青安貸款上限</text>
    </g>

    <!-- Sub metrics -->
    <g transform="translate(28,224)">
      <line x1="0" y1="0" x2="288" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
    </g>

    <g transform="translate(28,248)">
      <text x="0" y="0" font-family="'Source Sans 3',sans-serif" font-size="12" font-weight="700" fill="#8ab4d8" letter-spacing="2">利率</text>
      <text x="0" y="32" font-family="'DM Serif Display',Georgia,sans-serif" font-size="30" font-weight="700" fill="#ffffff">1.775<tspan font-size="16" font-weight="600" dx="2">%</tspan></text>
    </g>

    <g transform="translate(168,248)">
      <text x="0" y="0" font-family="'Source Sans 3',sans-serif" font-size="12" font-weight="700" fill="#8ab4d8" letter-spacing="2">年限</text>
      <text x="0" y="32" font-family="'DM Serif Display',Georgia,sans-serif" font-size="30" font-weight="700" fill="#ffffff">40<tspan font-size="16" font-weight="600" dx="2">年</tspan></text>
    </g>

    <line x1="28" y1="304" x2="316" y2="304" stroke="#ffffff" stroke-width="1" opacity="0.15"/>

    <!-- Narrative -->
    <g transform="translate(28,332)">
      <text font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="13" fill="#ffffff" opacity="0.92">
        <tspan x="0" dy="0">800–1200 萬對應新莊副都心、</tspan>
        <tspan x="0" dy="22">汐止 4 字頭、林口重劃區的</tspan>
        <tspan x="0" dy="22">2 房電梯大樓，是新青安</tspan>
        <tspan x="0" dy="22">寬限期族群的最佳進場區間。</tspan>
      </text>
    </g>

    <!-- Deadline footer -->
    <g transform="translate(28,434)">
      <circle cx="0" cy="-4" r="3" fill="#e74c3c"/>
      <text x="10" y="0" font-family="'Source Sans 3','PingFang TC',sans-serif" font-size="12" font-weight="700" fill="#e74c3c" letter-spacing="1">窗口 2026/07/31 前</text>
    </g>
  </g>

  <text x="60" y="694" font-size="12" fill="#8a9ab0" letter-spacing="1">HOMELAB · 雙北 500-1500 萬購屋指南</text>
  <text x="1220" y="694" text-anchor="end" font-size="12" fill="#8a9ab0" letter-spacing="1">08 / 13</text>
</svg>
