<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Source Sans 3, Arial, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <!-- Editorial Infographic | Layout: mixed_grid (hero chart left + stacked insight right) -->

  <!-- Defs: shadows and gradients (decorative / filters) -->
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1b2838" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="heroCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <linearGradient id="darkCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
  </defs>

  <!-- Slide background -->
  <rect width="1280" height="720" fill="#f8f9fa"/>

  <!-- Decorative magazine accent -->
  <g data-decorative="true">
    <rect x="60" y="60" width="4" height="44" fill="#e74c3c"/>
  </g>

  <!-- ========== HEADER ========== -->
  <text x="80" y="82" fill="#e74c3c" font-size="13" font-weight="700" letter-spacing="3">PART 3 / 11  ·  LIFESTYLE CIRCLES</text>
  <text x="80" y="124" fill="#1b2838" font-size="38" font-weight="700" font-family="DM Serif Display, Georgia, 'PingFang SC', 'Microsoft YaHei', serif">六大捷運生活圈機能對比</text>
  <text x="80" y="152" fill="#4a6fa5" font-size="16" font-weight="400">商圈 · 學區 · 醫療 · 轉乘  四維度綜合評比（滿分 100）</text>

  <!-- Header divider -->
  <line x1="80" y1="172" x2="1200" y2="172" stroke="#e9ecef" stroke-width="1"/>

  <!-- ========== LEFT: HERO CHART CARD ========== -->
  <g transform="translate(80,192)" filter="url(#cardShadow)">
    <rect width="720" height="456" rx="6" ry="6" fill="url(#heroCardGrad)" stroke="#e9ecef" stroke-width="1"/>

    <!-- Card header -->
    <text x="28" y="42" fill="#1b2838" font-size="20" font-weight="700" font-family="DM Serif Display, Georgia, 'PingFang SC', 'Microsoft YaHei', serif">生活圈綜合評分 Ranking</text>
    <text x="28" y="64" fill="#6c757d" font-size="13">＝ 捷運轉乘 ＋ 商圈密度 ＋ 學區資源 ＋ 醫療可近性</text>

    <!-- Scale marker -->
    <line x1="28" y1="82" x2="692" y2="82" stroke="#e9ecef" stroke-width="1"/>
    <text x="360" y="100" fill="#6c757d" font-size="13" letter-spacing="1">0</text>
    <text x="432" y="100" fill="#6c757d" font-size="13" letter-spacing="1">25</text>
    <text x="507" y="100" fill="#6c757d" font-size="13" letter-spacing="1">50</text>
    <text x="582" y="100" fill="#6c757d" font-size="13" letter-spacing="1">75</text>
    <text x="651" y="100" fill="#6c757d" font-size="13" letter-spacing="1">100</text>

    <!-- Rank 1: 板橋站 95 (accent red = champion) -->
    <text x="28" y="144" fill="#6c757d" font-size="13" font-weight="700" letter-spacing="1">01</text>
    <text x="58" y="144" fill="#1b2838" font-size="15" font-weight="700">板橋站</text>
    <text x="150" y="144" fill="#6c757d" font-size="13">雙鐵 + 府中商圈</text>
    <rect x="360" y="130" width="300" height="22" rx="2" ry="2" fill="#f1f3f5"/>
    <rect x="360" y="130" width="285" height="22" rx="2" ry="2" fill="#e74c3c"/>
    <text x="666" y="146" fill="#1b2838" font-size="16" font-weight="700">95</text>

    <!-- Rank 2: 新莊蘆洲 88 -->
    <text x="28" y="194" fill="#6c757d" font-size="13" font-weight="700" letter-spacing="1">02</text>
    <text x="58" y="194" fill="#1b2838" font-size="15" font-weight="700">新莊蘆洲線</text>
    <text x="170" y="194" fill="#6c757d" font-size="13">三年漲 50% · 台北橋量最大</text>
    <rect x="360" y="180" width="300" height="22" rx="2" ry="2" fill="#f1f3f5"/>
    <rect x="360" y="180" width="264" height="22" rx="2" ry="2" fill="#3498db"/>
    <text x="666" y="196" fill="#1b2838" font-size="16" font-weight="700">88</text>

    <!-- Rank 3: 中和新蘆 85 -->
    <text x="28" y="244" fill="#6c757d" font-size="13" font-weight="700" letter-spacing="1">03</text>
    <text x="58" y="244" fill="#1b2838" font-size="15" font-weight="700">中和新蘆</text>
    <text x="150" y="244" fill="#6c757d" font-size="13">景安雙捷運 · 中永和第一環</text>
    <rect x="360" y="230" width="300" height="22" rx="2" ry="2" fill="#f1f3f5"/>
    <rect x="360" y="230" width="255" height="22" rx="2" ry="2" fill="#3498db"/>
    <text x="666" y="246" fill="#1b2838" font-size="16" font-weight="700">85</text>

    <!-- Rank 4: 北投淡信 82 -->
    <text x="28" y="294" fill="#6c757d" font-size="13" font-weight="700" letter-spacing="1">04</text>
    <text x="58" y="294" fill="#1b2838" font-size="15" font-weight="700">北投 淡信線</text>
    <text x="178" y="294" fill="#6c757d" font-size="13">溫泉醫療題材 · NVIDIA 加持</text>
    <rect x="360" y="280" width="300" height="22" rx="2" ry="2" fill="#f1f3f5"/>
    <rect x="360" y="280" width="246" height="22" rx="2" ry="2" fill="#2ecc71"/>
    <text x="666" y="296" fill="#1b2838" font-size="16" font-weight="700">82</text>

    <!-- Rank 5: 文山萬芳 78 -->
    <text x="28" y="344" fill="#6c757d" font-size="13" font-weight="700" letter-spacing="1">05</text>
    <text x="58" y="344" fill="#1b2838" font-size="15" font-weight="700">文山 / 萬芳</text>
    <text x="178" y="344" fill="#6c757d" font-size="13">政大商圈 · 環境清幽首購熱區</text>
    <rect x="360" y="330" width="300" height="22" rx="2" ry="2" fill="#f1f3f5"/>
    <rect x="360" y="330" width="234" height="22" rx="2" ry="2" fill="#2ecc71"/>
    <text x="666" y="346" fill="#1b2838" font-size="16" font-weight="700">78</text>

    <!-- Rank 6: 淡水線 60 -->
    <text x="28" y="394" fill="#6c757d" font-size="13" font-weight="700" letter-spacing="1">06</text>
    <text x="58" y="394" fill="#1b2838" font-size="15" font-weight="700">淡水線</text>
    <text x="150" y="394" fill="#6c757d" font-size="13">房價最親民 · 空間換通勤距離</text>
    <rect x="360" y="380" width="300" height="22" rx="2" ry="2" fill="#f1f3f5"/>
    <rect x="360" y="380" width="180" height="22" rx="2" ry="2" fill="#f39c12"/>
    <text x="666" y="396" fill="#1b2838" font-size="16" font-weight="700">60</text>

    <!-- Footer legend -->
    <line x1="28" y1="418" x2="692" y2="418" stroke="#e9ecef" stroke-width="1"/>
    <circle cx="34" cy="436" r="4" fill="#e74c3c"/>
    <text x="44" y="440" fill="#6c757d" font-size="13">90+ 機能王</text>
    <circle cx="134" cy="436" r="4" fill="#3498db"/>
    <text x="144" y="440" fill="#6c757d" font-size="13">80–89 成熟圈</text>
    <circle cx="244" cy="436" r="4" fill="#2ecc71"/>
    <text x="254" y="440" fill="#6c757d" font-size="13">70–79 均衡帶</text>
    <circle cx="354" cy="436" r="4" fill="#f39c12"/>
    <text x="364" y="440" fill="#6c757d" font-size="13">&lt; 70 價值帶</text>
    <text x="500" y="440" fill="#6c757d" font-size="13" font-style="italic">資料來源：HOMELAB 研究室</text>
  </g>

  <!-- ========== RIGHT COLUMN: 3 stacked insight cards ========== -->

  <!-- Card A: 機能王 (dark hero card) -->
  <g transform="translate(820,192)" filter="url(#cardShadow)">
    <rect width="380" height="142" rx="6" ry="6" fill="url(#darkCardGrad)"/>
    <rect x="0" y="0" width="4" height="142" fill="#e74c3c"/>
    <text x="24" y="36" fill="#e74c3c" font-size="13" font-weight="700" letter-spacing="3">MACHINE KING</text>
    <text x="24" y="72" fill="#ffffff" font-size="22" font-weight="700" font-family="DM Serif Display, Georgia, 'PingFang SC', 'Microsoft YaHei', serif">板橋站 = 雙鐵轉乘王</text>
    <line x1="24" y1="86" x2="72" y2="86" stroke="#e74c3c" stroke-width="2"/>
    <text x="24" y="110" fill="#6c757d" font-size="13">府中商圈 + 高鐵 + 台鐵 + 捷運</text>
    <text x="24" y="128" fill="#6c757d" font-size="13">單價高但機能滿分 · 綜合評分 95</text>
  </g>

  <!-- Card B: 成長冠軍 (white with red metric) -->
  <g transform="translate(820,354)" filter="url(#cardShadow)">
    <rect width="380" height="142" rx="6" ry="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
    <text x="24" y="34" fill="#e74c3c" font-size="13" font-weight="700" letter-spacing="3">FASTEST GROWTH</text>
    <text x="24" y="60" fill="#1b2838" font-size="17" font-weight="700">新莊蘆洲三年 +50%</text>
    <line x1="24" y1="72" x2="56" y2="72" stroke="#e74c3c" stroke-width="2"/>

    <text x="24" y="108" fill="#e74c3c" font-size="30" font-weight="700" font-family="DM Serif Display, Georgia, serif">927</text>
    <text x="100" y="108" fill="#6c757d" font-size="13">件/年</text>
    <text x="24" y="128" fill="#4a6fa5" font-size="13">台北橋 · 量最大</text>

    <line x1="200" y1="86" x2="200" y2="130" stroke="#e9ecef" stroke-width="1"/>

    <text x="216" y="108" fill="#1b2838" font-size="30" font-weight="700" font-family="DM Serif Display, Georgia, serif">446</text>
    <text x="292" y="108" fill="#6c757d" font-size="13">件/年</text>
    <text x="216" y="128" fill="#4a6fa5" font-size="13">景安 · 雙捷運交會</text>
  </g>

  <!-- Card C: 價值帶 (insight) -->
  <g transform="translate(820,516)" filter="url(#cardShadow)">
    <rect width="380" height="132" rx="6" ry="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="132" fill="#f39c12"/>
    <text x="24" y="34" fill="#f39c12" font-size="13" font-weight="700" letter-spacing="3">VALUE ZONE</text>
    <text x="24" y="60" fill="#1b2838" font-size="17" font-weight="700">淡水線 = 空間換距離</text>
    <line x1="24" y1="72" x2="56" y2="72" stroke="#f39c12" stroke-width="2"/>
    <text x="24" y="94" fill="#4a6fa5" font-size="13">機能僅 60 分但房價全雙北最親民</text>
    <text x="24" y="114" fill="#6c757d" font-size="13">首購族若可接受 50–60 分鐘通勤，</text>
    <text x="24" y="128" fill="#6c757d" font-size="13">500–1000 萬即可買 2 房電梯華廈。</text>
  </g>

  <text x="60" y="694" font-size="12" fill="#8a9ab0" letter-spacing="1">HOMELAB · 雙北 500-1500 萬購屋指南</text>
  <text x="1220" y="694" text-anchor="end" font-size="12" fill="#8a9ab0" letter-spacing="1">11 / 13</text>
</svg>
