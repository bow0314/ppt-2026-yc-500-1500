<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Source Sans 3', Arial, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <!-- ========================================================= -->
  <!-- Slide 13 | Editorial Infographic | END / CTA              -->
  <!-- Layout: Masthead + 2-Col Hero Recommendation + Dark CTA   -->
  <!-- ========================================================= -->

  <defs>
    <!-- Elevation filters -->
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1b2838" flood-opacity="0.04"/>
    </filter>
    <filter id="shadow-md" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1b2838" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-lg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#1b2838" flood-opacity="0.14"/>
    </filter>

    <!-- Hero gradient for CTA band (decorative, scoped in defs) -->
    <linearGradient id="cta-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>

    <!-- Accent bar gradient (red → amber) -->
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>

    <!-- Subtle card sheen -->
    <linearGradient id="card-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Decorative hairline pattern for CTA band -->
    <pattern id="hairline" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 6 L6 0" stroke="#ffffff" stroke-width="0.4" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- ==== Background ==== -->
  <rect width="1280" height="720" fill="#f8f9fa"/>

  <!-- ==== Decorative top rule (zone 3) ==== -->
  <g data-decorative="true">
    <rect x="0" y="0" width="1280" height="4" fill="#1b2838"/>
    <rect x="0" y="0" width="420" height="4" fill="#e74c3c"/>
  </g>

  <!-- ========================================================= -->
  <!-- MASTHEAD                                                   -->
  <!-- ========================================================= -->
  <g transform="translate(60, 44)">
    <!-- Eyebrow rule -->
    <g data-decorative="true">
      <line x1="0" y1="16" x2="36" y2="16" stroke="#e74c3c" stroke-width="3"/>
    </g>
    <text x="48" y="22" font-size="14" font-weight="700" fill="#e74c3c" letter-spacing="3">FINAL &#183; HOMELAB 精選</text>
    <text x="1160" y="22" font-size="12" fill="#6b7a90" text-anchor="end" letter-spacing="2">HOMELAB &#183; 2026 BUYER GUIDE</text>

    <!-- Title (serif) -->
    <text x="0" y="68" font-family="'DM Serif Display', Georgia, 'PingFang SC', 'Microsoft YaHei', serif"
          font-size="40" font-weight="700" fill="#1b2838">現在進場，買在價值帶</text>

    <!-- Subtitle -->
    <text x="0" y="100" font-size="17" fill="#4e5f72">Top3 性價比區  &#183;  新青安窗口  &#183;  專業陪跑  ──  2026 剛需族的理性進場年</text>

    <!-- Divider -->
    <line x1="0" y1="120" x2="1160" y2="120" stroke="#e9ecef" stroke-width="1"/>
  </g>

  <!-- ========================================================= -->
  <!-- TWO HERO RECOMMENDATION CARDS                              -->
  <!-- ========================================================= -->

  <!-- ============ CARD A · 台北市 TOP 3 ============ -->
  <g transform="translate(60, 198)">
    <rect width="570" height="268" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1" filter="url(#shadow-md)"/>

    <!-- Left color rail -->
    <g data-decorative="true">
      <rect x="0" y="0" width="4" height="268" fill="#e74c3c"/>
    </g>

    <!-- Header: index + kicker -->
    <g transform="translate(28, 28)">
      <rect width="38" height="38" rx="4" fill="#e74c3c"/>
      <text x="19" y="27" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" font-family="'DM Serif Display', Georgia, serif">A</text>
      <text x="52" y="16" font-size="12" font-weight="700" fill="#6b7a90" letter-spacing="2">TAIPEI CITY &#183; TOP 3</text>
      <text x="52" y="34" font-size="12" fill="#6b7a90" letter-spacing="1">台北市 &#183; 蛋白三強</text>
    </g>

    <!-- Card title (serif) -->
    <text x="28" y="104" font-family="'DM Serif Display', Georgia, 'PingFang SC', serif"
          font-size="30" font-weight="700" fill="#1b2838">北投 &#183; 文山 &#183; 萬華</text>
    <line x1="28" y1="120" x2="76" y2="120" stroke="#e74c3c" stroke-width="2.5"/>

    <text x="28" y="148" font-size="14" fill="#5a6c7d">1500 萬內 2 房可達  &#183;  CP 值最佳  &#183;  抗跌首選</text>

    <!-- Ranked list: 3 districts -->
    <g transform="translate(28, 172)">
      <!-- Row 1 · 北投 -->
      <g transform="translate(0, 0)">
        <g data-decorative="true">
          <circle cx="12" cy="12" r="12" fill="#fdf2f0"/>
        </g>
        <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#e74c3c">01</text>
        <text x="34" y="16" font-family="'DM Serif Display', Georgia, 'PingFang SC', serif" font-size="17" font-weight="700" fill="#1b2838">北投</text>
        <text x="86" y="16" font-size="12" fill="#5a6c7d">NVIDIA 總部題材  &#183;  2-3 房 24-26 坪</text>
        <text x="430" y="16" font-size="15" font-weight="700" fill="#e74c3c" font-family="'DM Serif Display', Georgia, serif">58</text>
        <text x="452" y="16" font-size="12" fill="#6b7a90">萬/坪</text>
      </g>
      <!-- Row 2 · 文山 -->
      <g transform="translate(0, 32)">
        <g data-decorative="true">
          <circle cx="12" cy="12" r="12" fill="#fdf2f0"/>
        </g>
        <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#e74c3c">02</text>
        <text x="34" y="16" font-family="'DM Serif Display', Georgia, 'PingFang SC', serif" font-size="17" font-weight="700" fill="#1b2838">文山</text>
        <text x="86" y="16" font-size="12" fill="#5a6c7d">政大商圈  &#183;  環境清幽  &#183;  2 房 26 坪可行</text>
        <text x="430" y="16" font-size="15" font-weight="700" fill="#e74c3c" font-family="'DM Serif Display', Georgia, serif">53</text>
        <text x="452" y="16" font-size="12" fill="#6b7a90">萬/坪</text>
      </g>
      <!-- Row 3 · 萬華 -->
      <g transform="translate(0, 64)">
        <g data-decorative="true">
          <circle cx="12" cy="12" r="12" fill="#fdf2f0"/>
        </g>
        <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#e74c3c">03</text>
        <text x="34" y="16" font-family="'DM Serif Display', Georgia, 'PingFang SC', serif" font-size="17" font-weight="700" fill="#1b2838">萬華</text>
        <text x="86" y="16" font-size="12" fill="#5a6c7d">都更題材強  &#183;  西門商圈  &#183;  老公寓為主</text>
        <text x="430" y="16" font-size="15" font-weight="700" fill="#e74c3c" font-family="'DM Serif Display', Georgia, serif">56</text>
        <text x="452" y="16" font-size="12" fill="#6b7a90">萬/坪</text>
      </g>
    </g>
  </g>

  <!-- ============ CARD B · 新北市 TOP 3 ============ -->
  <g transform="translate(650, 198)">
    <rect width="570" height="268" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1" filter="url(#shadow-md)"/>

    <!-- Left color rail -->
    <g data-decorative="true">
      <rect x="0" y="0" width="4" height="268" fill="#1a6fa8"/>
    </g>

    <!-- Header: index + kicker -->
    <g transform="translate(28, 28)">
      <rect width="38" height="38" rx="4" fill="#1a6fa8"/>
      <text x="19" y="27" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" font-family="'DM Serif Display', Georgia, serif">B</text>
      <text x="52" y="16" font-size="12" font-weight="700" fill="#6b7a90" letter-spacing="2">NEW TAIPEI &#183; TOP 3</text>
      <text x="52" y="34" font-size="12" fill="#6b7a90" letter-spacing="1">新北市 &#183; 性價比三冠</text>
    </g>

    <!-- Card title -->
    <text x="28" y="104" font-family="'DM Serif Display', Georgia, 'PingFang SC', serif"
          font-size="30" font-weight="700" fill="#1b2838">新莊 &#183; 汐止 &#183; 淡水</text>
    <line x1="28" y1="120" x2="76" y2="120" stroke="#3498db" stroke-width="2.5"/>

    <text x="28" y="148" font-size="14" fill="#5a6c7d">機能  ·  通勤  ·  坪效  三種最佳解  &#183;  主戰場首選</text>

    <!-- Ranked list: 3 districts -->
    <g transform="translate(28, 172)">
      <!-- Row 1 · 新莊 -->
      <g transform="translate(0, 0)">
        <g data-decorative="true">
          <circle cx="12" cy="12" r="12" fill="#ecf5fb"/>
        </g>
        <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#1a6fa8">01</text>
        <text x="34" y="16" font-family="'DM Serif Display', Georgia, 'PingFang SC', serif" font-size="17" font-weight="700" fill="#1b2838">新莊</text>
        <text x="86" y="16" font-size="12" fill="#5a6c7d">三捷運交會  &#183;  副都心新成屋</text>
        <text x="432" y="16" font-size="12" font-weight="700" fill="#1a6fa8" letter-spacing="1">機能王</text>
      </g>
      <!-- Row 2 · 汐止 -->
      <g transform="translate(0, 32)">
        <g data-decorative="true">
          <circle cx="12" cy="12" r="12" fill="#ecf5fb"/>
        </g>
        <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#1a6fa8">02</text>
        <text x="34" y="16" font-family="'DM Serif Display', Georgia, 'PingFang SC', serif" font-size="17" font-weight="700" fill="#1b2838">汐止</text>
        <text x="86" y="16" font-size="12" fill="#5a6c7d">南港內湖通勤族  &#183;  汐東線題材</text>
        <text x="432" y="16" font-size="12" font-weight="700" fill="#1a6fa8" letter-spacing="1">通勤王</text>
      </g>
      <!-- Row 3 · 淡水 -->
      <g transform="translate(0, 64)">
        <g data-decorative="true">
          <circle cx="12" cy="12" r="12" fill="#ecf5fb"/>
        </g>
        <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#1a6fa8">03</text>
        <text x="34" y="16" font-family="'DM Serif Display', Georgia, 'PingFang SC', serif" font-size="17" font-weight="700" fill="#1b2838">淡水</text>
        <text x="86" y="16" font-size="12" fill="#5a6c7d">1500 萬 44 坪  &#183;  家庭空間王</text>
        <text x="432" y="16" font-size="12" font-weight="700" fill="#1a6fa8" letter-spacing="1">坪效王</text>
      </g>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- DARK CTA BAND (hero band)                                  -->
  <!-- ========================================================= -->
  <g transform="translate(60, 480)">
    <!-- Card background (dark hero) -->
    <rect width="1160" height="178" rx="6" fill="url(#cta-bg)" filter="url(#shadow-lg)"/>
    <g data-decorative="true">
      <rect width="1160" height="178" rx="6" fill="url(#hairline)"/>
      <rect width="1160" height="178" rx="6" fill="url(#card-sheen)"/>
      <!-- Left accent rail (gradient red → amber) -->
      <rect x="0" y="0" width="4" height="178" fill="url(#accent-bar)"/>
    </g>

    <!-- Kicker row -->
    <g transform="translate(32, 32)">
      <text font-size="12" font-weight="700" fill="#e74c3c" letter-spacing="3">CALL TO ACTION</text>
      <text x="148" y="0" font-size="12" fill="#8fa3b4" letter-spacing="2">CONTACT HOMELAB  &#183;  2026 WINDOW</text>
    </g>

    <!-- Left: main CTA headline -->
    <g transform="translate(32, 76)">
      <text font-family="'DM Serif Display', Georgia, 'PingFang SC', serif"
            font-size="30" font-weight="700" fill="#ffffff">2026/7 前鎖定新青安低利率</text>
      <text y="34" font-size="15" fill="#e0e8f0">HOMELAB 研究室  ·  歡迎分享，祝你找到理想的家</text>

      <!-- Micro chip row -->
      <g transform="translate(0, 56)">
        <!-- Chip 1 -->
        <rect x="0" y="0" width="136" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
        <circle cx="16" cy="14" r="3.5" fill="#e74c3c"/>
        <text x="26" y="18" font-size="12" font-weight="600" fill="#ffffff">1.775% 最後窗口</text>
        <!-- Chip 2 -->
        <rect x="148" y="0" width="120" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
        <circle cx="164" cy="14" r="3.5" fill="#1a6fa8"/>
        <text x="174" y="18" font-size="12" font-weight="600" fill="#ffffff">40 年貸款</text>
        <!-- Chip 3 -->
        <rect x="280" y="0" width="158" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
        <circle cx="296" cy="14" r="3.5" fill="#2ecc71"/>
        <text x="306" y="18" font-size="12" font-weight="600" fill="#ffffff">第 2 戶成數升 60%</text>
      </g>
    </g>

    <!-- Right: deadline metric block -->
    <g transform="translate(760, 48)">
      <!-- Vertical divider -->
      <line x1="0" y1="-4" x2="0" y2="112" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

      <!-- Label -->
      <text x="28" y="10" font-size="12" font-weight="700" fill="#e74c3c" letter-spacing="2">DEADLINE &#183; 進場窗口</text>

      <!-- Big date -->
      <text x="28" y="62" font-family="'DM Serif Display', Georgia, serif" font-size="54" font-weight="700" fill="#ffffff">2026</text>
      <text x="160" y="62" font-family="'DM Serif Display', Georgia, serif" font-size="54" font-weight="700" fill="#e74c3c">/7</text>

      <!-- Sub-label -->
      <text x="28" y="90" font-size="14" fill="#ffffff" opacity="0.75">新青安現行方案落日</text>
      <text x="28" y="108" font-size="12" fill="#a0b4c4" letter-spacing="1">LAST CALL FOR FIRST-TIME BUYERS</text>

      <!-- CONTACT pill: aligned to LAST CALL baseline (y=108, rect centred on it) -->
      <g transform="translate(278, 93)">
        <rect x="0" y="0" width="88" height="22" rx="11" fill="#e74c3c"/>
        <text x="10" y="15" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">CONTACT</text>
        <path d="M72 5 L79 11 L72 17 Z" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <text x="60" y="694" font-size="12" fill="#8a9ab0" letter-spacing="1">HOMELAB · 雙北 500-1500 萬購屋指南</text>
  <text x="1220" y="694" text-anchor="end" font-size="12" fill="#8a9ab0" letter-spacing="1">13 / 13</text>
</svg>
